# Block für SunWatcher (sauerburg.at)
server {
    listen 80;
    server_name sauerburg.at www.sauerburg.at;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://sun_backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Platzhalter-Block für fotografie-nina.at
server {
    listen 80;
    server_name fotografie-nina.at www.fotografie-nina.at;

    location / {
        return 200 "Hier entsteht bald die Webseite von Fotografie Nina.";
        add_header Content-Type text/plain;
    }
}
