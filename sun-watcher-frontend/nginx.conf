# --- HTTP (Port 80) ---
# Wir nutzen nur noch Port 80 und entfernen alle SSL-Zertifikatspfade.

# --- SunWatcher (ehemals sauerburg.at) ---
server {
    listen 80;
    server_name localhost;

    # Root außerhalb der Location setzen ist sauberer
    root /usr/share/nginx/html;
    index index.html index.htm;

    # --- JETZT AUCH HIER: WEITERLEITUNG ZUM BACKEND ---
    location /api/ {
       proxy_pass http://sun_backend:8080/api/;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Versuche die Datei zu finden, wenn nicht, gib die index.html aus (wichtig für Angular)
        try_files $uri $uri/ /index.html =404;
    }

    # Optional: Fehler-Logging einschalten, um zu sehen, WO er sucht
    error_log  /var/log/nginx/error.log debug;
}

# --- Nina-Frontend & API (ehemals fotografie-nina.at) ---
server {
    listen 8081; # Wir nutzen einen anderen Port, damit sich die beiden Frontends nicht beißen
    server_name localhost fotografie-nina.at www.fotografie-nina.at;

    # --- WEITERLEITUNG ZUM BACKEND (JAVA) ---
    location /api/ {
        # 'sun_backend' muss dem Namen in deiner docker-compose.yml entsprechen
        proxy_pass http://sun_backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WEITERLEITUNG ZUM FRONTEND (ANGULAR) ---
    location / {
        # 'nina_frontend' muss dem Namen in deiner docker-compose.yml entsprechen
        proxy_pass http://nina_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
