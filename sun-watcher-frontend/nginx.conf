# 1. Gemeinsame HTTP -> HTTPS Umleitung für alle Domains
server {
    listen 80;
    server_name sauerburg.at www.sauerburg.at fotografie-nina.at www.fotografie-nina.at;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server für SAUERBURG.AT (SunWatcher)
server {
    listen 443 ssl;
    server_name sauerburg.at www.sauerburg.at;

    ssl_certificate     /etc/letsencrypt/live/sauerburg.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sauerburg.at/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Dateien für SunWatcher liegen lokal im Container
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=Lax";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 3. HTTPS Server für FOTOGRAFIE-NINA.AT
server {
    listen 443 ssl;
    server_name fotografie-nina.at www.fotografie-nina.at;

    ssl_certificate     /etc/letsencrypt/live/fotografie-nina.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fotografie-nina.at/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Nina-Frontend ist ein eigener Container!
    location / {
        proxy_pass http://nina_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API-Weiterleitung für Nina (z.B. Kontaktformular)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=Lax";
    }
}
