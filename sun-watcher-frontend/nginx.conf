# 1. HTTP -> Umleitung auf HTTPS
server {
    listen 80;
    server_name sauerburg.at www.sauerburg.at fotografie-nina.at www.fotografie-nina.at;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server
server {
    listen 443 ssl;
    server_name sauerburg.at www.sauerburg.at fotografie-nina.at www.fotografie-nina.at;

    # SSL Zertifikate (Pfade müssen zum Mount in docker-compose passen)
    ssl_certificate     /etc/letsencrypt/live/sauerburg.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sauerburg.at/privkey.pem;

    # Nina Zertifikate (Stelle sicher, dass die Pfade stimmen!)
        ssl_certificate     /etc/letsencrypt/live/fotografie-nina.at/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fotografie-nina.at/privkey.pem;

    # Sicherheits-Optimierungen
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # --- API / BACKEND ---
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Backend "sieht" HTTPS

        # Verhindert Login-Fehler durch Cookie-Ablehnung
        proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=Lax";
    }

    # --- FRONTEND ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
