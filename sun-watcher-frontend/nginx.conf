# /etc/nginx/nginx.conf

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Kompression für bessere Performance (Angular)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- SunWatcher Server Block ---
    server {
        listen 80;
        server_name sauerburg.at www.sauerburg.at;

        root /usr/share/nginx/html;
        index index.html;

        # --- API / BACKEND ---
        location /api/ {
            proxy_pass http://sun_backend:8080/api/;

            # Header für das Backend, damit es weiß, dass HTTPS genutzt wird
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WICHTIG: Erzwingt 'https', auch wenn der Nginx selbst nur auf 80 hört.
            # Ohne dies setzt Java/Spring Cookies ohne 'Secure' Flag.
            proxy_set_header X-Forwarded-Proto https;

            # Cookie-Pfad Anpassung: Sorgt dafür, dass Cookies sicher übertragen werden
            proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=Lax";

            # Timeout-Einstellungen (wichtig für längere Berechnungen)
            proxy_connect_timeout 90;
            proxy_send_timeout 90;
            proxy_read_timeout 90;

            # CORS Header
            add_header 'Access-Control-Allow-Origin' 'https://sauerburg.at' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since' always;

            # OPTIONS Preflight-Requests abfangen
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # --- FRONTEND (ANGULAR) ---
        location / {
            # Wichtig für Single Page Applications (SPA):
            # Leitet alle Pfade auf die index.html um
            try_files $uri $uri/ /index.html;

            # Cache-Control für statische Dateien
            expires 1d;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }

        # Sicherheit: Verhindere Zugriff auf versteckte Dateien (.git etc.)
        location ~ /\. {
            deny all;
        }
    }
}
