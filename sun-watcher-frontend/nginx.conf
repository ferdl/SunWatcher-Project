# --- BLOCK 1: SunWatcher (Hauptseite & Auffangnetz) ---
server {
    # 'default_server' sorgt dafür, dass dieser Block auch bei IP-Zugriff
    # oder unbekannten Domains antwortet.
    listen 80 default_server;
    server_name sauerburg.at www.sauerburg.at;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://sun_backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# --- BLOCK 2: Fotografie Nina ---
server {
    listen 80;
    server_name fotografie-nina.at www.fotografie-nina.at;

    location / {
        return 200 "Hier entsteht bald die Webseite von Fotografie Nina.";
        add_header Content-Type text/plain;
    }
}
