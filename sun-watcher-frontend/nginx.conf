# --- HTTP (Port 80): Automatische Weiterleitung auf HTTPS ---
server {
    listen 80;
    server_name sauerburg.at www.sauerburg.at fotografie-nina.at www.fotografie-nina.at;
    return 301 https://$host$request_uri;
}

# --- HTTPS (Port 443): SunWatcher ---
# --- HTTPS: sauerburg.at ---
server {
    listen 443 ssl;
    server_name sauerburg.at www.sauerburg.at;

    # Nutzt das spezifische Sauerburg-Zertifikat
    ssl_certificate /etc/letsencrypt/live/sauerburg.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sauerburg.at/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    # ... restlicher Code für Sauerburg ...
}

# --- HTTPS: fotografie-nina.at ---
server {
    listen 443 ssl;
    server_name fotografie-nina.at www.fotografie-nina.at;

    # Nutzt das spezifische Nina-Zertifikat (-0001)
    ssl_certificate /etc/letsencrypt/live/fotografie-nina.at-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fotografie-nina.at-0001/privkey.pem;

    location / {
        proxy_pass http://nina-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
