# --- BLOCK 1: SunWatcher (sauerburg.at) ---
server {
    listen 80;
    server_name sauerburg.at www.sauerburg.at;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API-Weiterleitung zum Java-Backend
    location /api/ {
        proxy_pass http://sun_backend:8080/api/;
        proxy_set_header Host $host;
    }
}

# --- BLOCK 2: Fotografie Nina (Platzhalter) ---
server {
    listen 80;
    server_name fotografie-nina.at www.fotografie-nina.at;

    location / {
        # Das ist die Nachricht, die Nina sehen sollte
        return 200 "Hier entsteht bald die Webseite von Fotografie Nina.";
        add_header Content-Type text/plain;
    }
}
