# --- SunWatcher Server Block ---
server {
    listen 80;
    server_name sauerburg.at www.sauerburg.at;

    root /usr/share/nginx/html;
    index index.html;

    # --- API / BACKEND ---
    location /api/ {
        # WICHTIG: Hier muss der Service-Name stehen, den du in docker-compose.yml nutzt.
        # Laut deinem Log ist es vermutlich 'backend' oder 'sun_backend'
        proxy_pass http://backend:8080/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Sagt dem Backend, dass die ursprüngliche Anfrage HTTPS war
        proxy_set_header X-Forwarded-Proto https;

        # Zwingt Cookies auf HTTPS-Sicherheit
        proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=Lax";

        # CORS Header
        add_header 'Access-Control-Allow-Origin' 'https://sauerburg.at' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # --- FRONTEND (ANGULAR/REACT) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
