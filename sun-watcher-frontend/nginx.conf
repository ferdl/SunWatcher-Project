# --- HTTP (Port 80): Automatische Weiterleitung auf HTTPS ---
server {
    listen 80;
    server_name sauerburg.at www.sauerburg.at fotografie-nina.at www.fotografie-nina.at;
    return 301 https://$host$request_uri;
}

# --- HTTPS (Port 443): SunWatcher ---
server {
    listen 443 ssl;
    server_name sauerburg.at www.sauerburg.at;

    ssl_certificate /etc/letsencrypt/live/sauerburg.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sauerburg.at/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://sun_backend:8080/api/;
        proxy_set_header Host $host;
    }
}

# --- HTTPS (Port 443): Fotografie Nina ---
server {
    listen 443 ssl;
    server_name fotografie-nina.at www.fotografie-nina.at;

    ssl_certificate /etc/letsencrypt/live/sauerburg.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sauerburg.at/privkey.pem;

    location / {
        return 200 "Hier entsteht bald die Webseite von Fotografie Nina.";
        add_header Content-Type text/plain;
    }
}
