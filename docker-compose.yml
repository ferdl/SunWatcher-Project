services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=sundb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sundb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./SunService
    container_name: sun_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/sundb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APP_CORS_ALLOWED_ORIGINS=https://sauerburg.at,https://www.sauerburg.at,https://fotografie-nina.at,https://www.fotografie-nina.at,https://sauerburg.at.127.0.0.1.nip.io:8443,https://www.sauerburg.at.127.0.0.1.nip.io:8443,https://fotografie-nina.at.127.0.0.1.nip.io:8443,https://www.fotografie-nina.at.127.0.0.1.nip.io:8443,http://localhost,http://localhost:4200
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    volumes:
      - ./gallery-images:/app/images/gallery

  frontend:
    build: ./sun-watcher-frontend
    container_name: sun_frontend
    ports:
      - "${EXTERNAL_HTTP_PORT}:80"
      - "${EXTERNAL_HTTPS_PORT}:443"
    volumes:
      # Die nginx.conf wird variabel gemountet
      - ${NGINX_CONF_FILE}:/etc/nginx/conf.d/default.conf:ro
      # Die SSL Zertifikate werden variabel gemountet
      - ${SSL_PATH}:/etc/letsencrypt:ro
    depends_on:
      - backend
      - nina_frontend

  nina_frontend:
    build: ./nina-frontend
    container_name: nina_frontend

volumes:
  postgres_data: