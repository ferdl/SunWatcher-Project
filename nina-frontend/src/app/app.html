<div class="welcome-container">
  <header>
    <h1>FOTOGRAFIE NINA</h1>
    <p class="subtitle">Augenblicke für die Ewigkeit festgehalten</p>
    <div class="divider"></div>
  </header>

  <section class="intro">
    <h2>Willkommen</h2>
    <p>Schön, dass du da bist. Ich liebe es, die kleinen und großen Geschichten des Lebens in Bildern zu erzählen.</p>
  </section>

  <section class="gallery">
    <div class="gallery-item" (click)="openLightbox('/assets/images/foto1.jpg')">
      <img src="/assets/images/foto1.jpg" alt="Portfolio Bild 1">
    </div>

    <div class="gallery-item" (click)="openLightbox('/assets/images/foto2.jpg')">
      <img src="/assets/images/foto2.jpg" alt="Portfolio Bild 2">
    </div>

    <div class="gallery-item" (click)="openLightbox('/assets/images/foto3.jpg')">
      <img src="/assets/images/foto3.jpg" alt="Portfolio Bild 3">
    </div>

    <div class="gallery-item" (click)="openLightbox('/assets/images/foto4.jpg')">
      <img src="/assets/images/foto4.jpg" alt="Portfolio Bild 4">
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Fotografie Nina | <a href="#">Kontakt & Impressum</a></p>
  </footer>
</div>

<div class="lightbox-overlay" *ngIf="selectedImage" (click)="closeLightbox()">

  <button class="close-btn" (click)="closeLightbox()">&times;</button>

  <img [src]="selectedImage"
       class="lightbox-image"
       alt="Vergrößerte Ansicht"
       (click)="$event.stopPropagation()">
</div>
