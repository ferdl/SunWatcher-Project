<div class="site-container">
  <!-- Header / Navigationsleiste -->
  <header class="site-header">
    <div class="header-content">
      <a routerLink="/" class="logo" (click)="closeMobileMenu()">
        <span class="logo-title">Nina Fotografie</span>
        <span class="logo-subtitle">St. Andrä-Wördern</span>
      </a>

      <!-- Hamburger Button (nur auf Smartphones sichtbar) -->
      <button
        class="menu-toggle"
        (click)="toggleMobileMenu()"
        [class.active]="isMobileMenuOpen()"
        aria-label="Menü umschalten">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <!-- Navigationsleiste -->
      <nav class="main-nav" [class.open]="isMobileMenuOpen()">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">Startseite</a>
        <a routerLink="/babybauch" routerLinkActive="active" (click)="closeMobileMenu()">Babybauch</a>
        <a routerLink="/newborn" routerLinkActive="active" (click)="closeMobileMenu()">Newborn</a>
        <a routerLink="/familie" routerLinkActive="active" (click)="closeMobileMenu()">Kinder & Familie</a>
        <a routerLink="/kindergarten" routerLinkActive="active" (click)="closeMobileMenu()">Kindergarten</a>
        <a routerLink="/kontakt" routerLinkActive="active" (click)="closeMobileMenu()">Kontakt</a>
      </nav>
    </div>
  </header>

  <!-- Dynamischer Seiteninhalt -->
  <main class="site-main">
    <router-outlet></router-outlet>
  </main>

  <!-- Globaler Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-info">
        <h4>Nina Fotografie</h4>
        <p>Fotografin für Newborn, Babybauch & Familie</p>
        <p>St. Andrä-Wördern / Tulln & Umgebung</p>
      </div>

      <div class="footer-links">
        <a routerLink="/kontakt">Kontakt</a>
        <a routerLink="/impressum">Impressum</a>
        <a routerLink="/datenschutz">Datenschutz</a>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; 2026 Nina Fotografie. Alle Rechte vorbehalten.</p>
    </div>
  </footer>
</div>
